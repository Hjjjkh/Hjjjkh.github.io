h2{margin-top:0;font-size:1.8em;border-bottom:2px solid var(--link-hover-color);padding-bottom:10px;margin-bottom:20px}.tool-group{margin-bottom:1.5rem}.tool-group label{display:block;margin-bottom:8px;font-weight:500;color:var(--text-color)}.tool-input{width:100%;padding:12px;border:1px solid var(--line-color);border-radius:6px;background-color:var(--body-bg-color);color:var(--text-color);font-size:1em;transition:border-color .3s ease,box-shadow .3s ease}.tool-input:focus{outline:0;border-color:var(--link-hover-color);box-shadow:0 0 0 3px rgba(3,102,214,.2)}.tool-buttons{display:flex;gap:15px;margin-top:1rem;flex-wrap:wrap}.tool-button{padding:10px 20px;border:none;border-radius:6px;background-color:var(--link-hover-color);color:#fff;font-size:1em;cursor:pointer;transition:background-color .3s ease,transform .2s ease}.tool-button:hover{opacity:.9;transform:translateY(-2px)}.tool-result{margin-top:1.5rem;padding:15px;background-color:var(--body-bg-color);border-radius:6px;border:1px solid var(--line-color);word-wrap:break-word;font-family:'Courier New',Courier,monospace;color:var(--post-text-color)}.tool-result strong{color:var(--post-heading-color)}.current-timestamp{margin-bottom:2rem;text-align:center}.current-timestamp-label{font-size:1.1em;color:var(--sec-text-color)}.current-timestamp-value{font-size:2em;font-weight:600;color:var(--post-heading-color);letter-spacing:1px;margin-top:8px}</style><div class="tool-container"><div class="tool-card"><h2>时间戳转换</h2><figure><div class="code-wrapper"><pre class="language-none"><code class="language-none">&lt;div class=&quot;current-timestamp&quot;&gt;
    &lt;div class=&quot;current-timestamp-label&quot;&gt;当前 Unix 时间戳 (秒)&lt;/div&gt;
    &lt;div id=&quot;current-timestamp-value&quot; class=&quot;current-timestamp-value&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;tool-group&quot;&gt;
  &lt;label for=&quot;timestamp-input&quot;&gt;Unix 时间戳 (秒或毫秒)&lt;/label&gt;
  &lt;input type=&quot;text&quot; id=&quot;timestamp-input&quot; class=&quot;tool-input&quot; placeholder=&quot;例如: 1672531200&quot;&gt;
&lt;/div&gt;
&lt;div class=&quot;tool-buttons&quot;&gt;
  &lt;button id=&quot;ts-to-date-btn&quot; class=&quot;tool-button&quot;&gt;转换为日期&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;ts-to-date-result&quot; class=&quot;tool-result&quot; style=&quot;display: none;&quot;&gt;&lt;/div&gt;

&lt;hr style=&quot;margin: 2.5rem 0;&quot;&gt;

&lt;div class=&quot;tool-group&quot;&gt;
  &lt;label for=&quot;date-input&quot;&gt;日期和时间&lt;/label&gt;
  &lt;input type=&quot;text&quot; id=&quot;date-input&quot; class=&quot;tool-input&quot; placeholder=&quot;例如: 2023-01-01 08:00:00&quot;&gt;
&lt;/div&gt;
&lt;div class=&quot;tool-buttons&quot;&gt;
  &lt;button id=&quot;date-to-ts-btn&quot; class=&quot;tool-button&quot;&gt;转换为时间戳&lt;/button&gt;
  &lt;button id=&quot;set-current-time-btn&quot; class=&quot;tool-button&quot;&gt;填充当前时间&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;date-to-ts-result&quot; class=&quot;tool-result&quot; style=&quot;display: none;&quot;&gt;&lt;/div&gt;
</code></pre></div></figure></div></div><script>document.addEventListener('DOMContentLoaded', function() {
    const currentTimeElem = document.getElementById('current-timestamp-value');
    const timestampInput = document.getElementById('timestamp-input');
    const tsToDateBtn = document.getElementById('ts-to-date-btn');
    const tsToDateResult = document.getElementById('ts-to-date-result');
    const dateInput = document.getElementById('date-input');
    const dateToTsBtn = document.getElementById('date-to-ts-btn');
    const setCurrentTimeBtn = document.getElementById('set-current-time-btn');
    const dateToTsResult = document.getElementById('date-to-ts-result');

    function updateCurrentTimestamp() {
        currentTimeElem.textContent = Math.floor(Date.now() / 1000);
    }

    function formatDateTime(date) {
        const Y = date.getFullYear();
        const M = String(date.getMonth() + 1).padStart(2, '0');
        const D = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const m = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        return `${Y}-${M}-${D} ${h}:${m}:${s}`;
    }

    tsToDateBtn.addEventListener('click', function() {
        const ts = timestampInput.value.trim();
        if (!ts || !/^-?\d+$/.test(ts)) {
            tsToDateResult.innerHTML = '<strong>错误:</strong> 请输入有效的时间戳数字。';
            tsToDateResult.style.display = 'block';
            return;
        }
        
        const tsNumber = parseInt(ts, 10);
        // Auto-detect seconds or milliseconds
        const date = new Date(ts.length > 10 ? tsNumber : tsNumber * 1000);
        
        if (isNaN(date.getTime())) {
            tsToDateResult.innerHTML = '<strong>错误:</strong> 无效的时间戳。';
        } else {
            tsToDateResult.innerHTML = `<strong>北京时间 (GMT+8):</strong> ${formatDateTime(date)}`;
        }
        tsToDateResult.style.display = 'block';
    });

    dateToTsBtn.addEventListener('click', function() {
        const dateStr = dateInput.value.trim();
        if (!dateStr) {
            dateToTsResult.innerHTML = '<strong>错误:</strong> 请输入日期和时间。';
            dateToTsResult.style.display = 'block';
            return;
        }
        
        // Replace hyphen with slash for better compatibility
        const date = new Date(dateStr.replace(/-/g, '/'));
        
        if (isNaN(date.getTime())) {
            dateToTsResult.innerHTML = '<strong>错误:</strong> 无效的日期格式。请使用 YYYY-MM-DD HH:mm:ss 格式。';
        } else {
            const tsSec = Math.floor(date.getTime() / 1000);
            const tsMs = date.getTime();
            dateToTsResult.innerHTML = `<strong>时间戳 (秒):</strong> ${tsSec}<br><strong>时间戳 (毫秒):</strong> ${tsMs}`;
        }
        dateToTsResult.style.display = 'block';
    });

    setCurrentTimeBtn.addEventListener('click', function() {
        dateInput.value = formatDateTime(new Date());
    });

    // Initial update and set interval
    updateCurrentTimestamp();
    setInterval(updateCurrentTimestamp, 1000);
});</script></article></div></div></div></div></div><a id="scroll-top-button" aria-label="TOP" href="#" role="button"><i class="iconfont icon-arrowup" aria-hidden="true"></i></a><div class="modal fade" id="modalSearch" tabindex="-1" role="dialog" aria-labelledby="ModalLabel" aria-hidden="true"><div class="modal-dialog modal-dialog-scrollable modal-lg" role="document"><div class="modal-content"><div class="modal-header text-center"><h4 class="modal-title w-100 font-weight-bold">搜索</h4><button type="button" id="local-search-close" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button></div><div class="modal-body mx-3"><div class="md-form mb-5"><input type="text" id="local-search-input" class="form-control validate"> <label data-error="x" data-success="v" for="local-search-input">关键词</label></div><div class="list-group" id="local-search-result"></div></div></div></div></div></main><footer><div class="footer-inner"><div class="footer-content"><a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a> <i class="iconfont icon-love"></i> <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a></div><div class="statistics"><span id="busuanzi_container_site_pv" style="display:none">总访问量 <span id="busuanzi_value_site_pv"></span> 次 </span><span id="busuanzi_container_site_uv" style="display:none">总访客数 <span id="busuanzi_value_site_uv"></span> 人</span></div></div><script src="https://lib.baomitu.com/nprogress/0.2.0/nprogress.min.js"></script><link rel="stylesheet" href="https://lib.baomitu.com/nprogress/0.2.0/nprogress.min.css"><script>NProgress.configure({showSpinner:!1,trickleSpeed:100}),NProgress.start(),window.addEventListener("load",function(){NProgress.done()})</script><script src="https://lib.baomitu.com/jquery/3.6.4/jquery.min.js"></script><script src="https://lib.baomitu.com/twitter-bootstrap/4.6.1/js/bootstrap.min.js"></script><scr
